spring.application.name=bandit-games-backend
server.port=8083

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/banditgames
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.docker.compose.file=infrastructure/docker-compose.yaml

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/banditgames
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/banditgames/protocol/openid-connect/certs

# Keycloak Connection
keycloak.server-url=http://localhost:8081
keycloak.realm=banditgames
keycloak.admin-username=admin
keycloak.admin-password=admin

cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:3333

connectfour.frontend.url=http://localhost:3000

platform.guest.expiration-days=30
platform.guest.cleanup-enabled=true

# ============================================
# RabbitMQ Connection
# ============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Listener Configuration
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# RabbitMQ Retry Configuration
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# ============================================
# Platform Messaging - Exchanges
# ============================================
platform.messaging.exchanges.platform-events=platform.events.exchange
platform.messaging.exchanges.game-events=game.events.exchange
platform.messaging.exchanges.platform-commands=platform.commands.exchange

# ============================================
# Platform Messaging - Queues
# ============================================
platform.messaging.queues.game-lifecycle=platform.game.lifecycle
platform.messaging.queues.game-registration=platform.game.registration
platform.messaging.queues.player-actions=platform.player.actions
platform.messaging.queues.achievements=platform.achievements
platform.messaging.queues.match-events=platform.match.events
platform.messaging.queues.lobby-events=platform.lobby.events
platform.messaging.queues.user-events=platform.user.events

# ============================================
# Platform Messaging - Routing Keys
# ============================================
platform.messaging.routing-keys.game-internal-registered=game.internal.registered
platform.messaging.routing-keys.game-external-registered=game.external.registered
platform.messaging.routing-keys.move-made=move.made
platform.messaging.routing-keys.move-validated=move.validated
platform.messaging.routing-keys.achievement-unlocked=achievement.unlocked
platform.messaging.routing-keys.player-joined=player.joined
platform.messaging.routing-keys.player-left=player.left
platform.messaging.routing-keys.match-created=match.created
platform.messaging.routing-keys.match-state-updated=match.state.updated
platform.messaging.routing-keys.match-started=match.started
platform.messaging.routing-keys.match-completed=match.completed
platform.messaging.routing-keys.lobby-created=lobby.created
platform.messaging.routing-keys.lobby-ready=lobby.ready
platform.messaging.routing-keys.user-created=user.created
platform.messaging.routing-keys.user-updated=user.updated

# ============================================
# Platform Messaging - Dead Letter Queue
# ============================================
platform.messaging.dead-letter.exchange=platform.dlx
platform.messaging.dead-letter.queue=platform.dlq
platform.messaging.dead-letter.routing-key=dead.letter
platform.messaging.dead-letter.message-ttl=86400000
platform.messaging.dead-letter.max-retries=3

# ============================================
# External Game Integration
# ============================================
external.game.game-type=CHESS

external.game.rabbitmq.host=localhost
external.game.rabbitmq.port=5673
# changed from the original for testing purposes
external.game.rabbitmq.username=user
external.game.rabbitmq.password=password
external.game.rabbitmq.exchange=gameExchange
external.game.rabbitmq.queue=platform.acl.queue
# changed from the original for testing purposes
external.game.rabbitmq.routing-key-pattern=#

# External game proxy
external.game.backend.url=http://localhost:8080



# RabbitMQ debug logging
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit=DEBUG
logging.level.be.kdg.banditgamesbackend.acl=DEBUG

# ============================================
# Platform SDK Configuration
# ============================================
banditgames.sdk.platform-url=http://localhost:8083
banditgames.sdk.auto-register=true
banditgames.sdk.game.name="Example game"
banditgames.sdk.game.description="This is a demo game for integration testing"
banditgames.sdk.game.render-type=external_iframe

banditgames.sdk.game.rules.summary="Rules are not implemented yet"
banditgames.sdk.game.player-configuration.max-players=2
banditgames.sdk.game.player-configuration.min-players=4
banditgames.sdk.game.meta-data.frontend-url=http://localhost:3000/game
banditgames.sdk.game.meta-data.picture-url=https://imgur.com/7mGZgUo.jpg
