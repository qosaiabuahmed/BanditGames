spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.listener.simple.auto-startup=true

platform.messaging.exchanges.game-events=game.events.exchange
platform.messaging.queues.achievements=platform.achievements
platform.messaging.routing-keys.achievement-unlocked=achievement.unlocked


external.game.rabbitmq.host=${spring.rabbitmq.host:localhost}
external.game.rabbitmq.port=${spring.rabbitmq.port:5672}
external.game.rabbitmq.username=${spring.rabbitmq.username:guest}
external.game.rabbitmq.password=${spring.rabbitmq.password:guest}

logging.level.be.kdg.banditgamesbackend=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG