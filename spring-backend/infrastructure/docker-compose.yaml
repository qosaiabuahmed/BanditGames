services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  app_postgres:
    image: postgres:17.6-alpine
    container_name: banditgames-postgres
    restart: always
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'banditgames'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5433:5432'
    networks:
      - kdg-backend
      - shared-network  # Connect to game-backend network
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./init-scripts/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Keycloak Authentication
  # ============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: banditgames-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://app_postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    ports:
      - '8081:8080'
    networks:
      - kdg-backend
      - shared-network  # Connect to game-backend network
    depends_on:
      app_postgres:
        condition: service_healthy

  # ============================================================================
  # RabbitMQ Message Broker
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: banditgames-rabbitmq
    restart: always
    ports:
      - '5672:5672'   # AMQP port
      - '15672:15672' # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - kdg-backend
      - shared-network  # Connect to game-backend network
      - acl-bridge  # Connect to chess backend network
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
      - ./rabbitmq/log/:/var/log/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  # ============================================================================
  # Spring Boot Backend Application
  # ============================================================================
  backend:
    # TEMPORARY: Building locally due to GitLab registry pull limits
    # TODO: Revert to GitLab image when limit issue is resolved
    # image: registry.gitlab.com/kdg-ti/inf-curriculum/domain-integration/integration-5/2025-2026/team10/spring-backend:latest
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    image: banditgames-backend:local
    container_name: banditgames-backend
    restart: always
    ports:
      - '8083:8083'
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - kdg-backend
      - shared-network  # Connect to game-backend network
      - chatbot-network  # Connect to chatbot network
      - acl-bridge  # Connect to chess backend network
    environment:
      # Database configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://app_postgres:5432/banditgames
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Keycloak configuration
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/banditgames/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080

      # RabbitMQ configuration
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      # Game Backend API (Connect Four Python service)
      GAME_BACKEND_URL: http://connect_four_app:8000

      # Chatbot API
      CHATBOT_API_URL: http://chatbot-api:7777

      # External Game Backend URL (Chess ACL)
      EXTERNAL_GAME_BACKEND_URL: http://host.docker.internal:8080

      # CORS Configuration
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80

      # Spring profiles
      SPRING_PROFILES_ACTIVE: prod

      # Disable Spring Boot Docker Compose integration (we're already in Docker)
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    depends_on:
      app_postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # React Frontend Application
  # ============================================================================
  frontend:
    build:
      context: ../../../React-frontend/react-frontend
      dockerfile: Dockerfile
    image: banditgames-frontend:latest
    container_name: banditgames-frontend
    restart: always
    ports:
      - '80:80'
    networks:
      - kdg-backend
      - shared-network  # Connect to game-backend network
    depends_on:
      - backend
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# ============================================================================
# Networks
# ============================================================================
networks:
  kdg-backend:
    driver: bridge

  # Shared network to communicate with game-backend (Connect Four Python service)
  # This allows banditgames services to call the Connect Four API
  shared-network:
    external: true
    name: game-backend_connect_four_network

  # Shared network to communicate with chatbot service
  # This allows banditgames backend to call the Chatbot API
  chatbot-network:
    external: true
    name: chatbot-network

  # Shared network to communicate with chess backend
  # This allows banditgames services to interact with chess game
  acl-bridge:
    external: true
    name: acl-bridge
