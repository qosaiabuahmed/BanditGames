services:
  db:
    image: postgres:15-alpine
    container_name: connect_four_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Student_1234
    ports:
      - "5434:5432"
    volumes:
      # Persistent data volume
      - postgres_data:/var/lib/postgresql/data
      # Initialize database with schema
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - connect_four_network

  # Python Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect_four_app
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      # Database connection settings
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: Student_1234
      # AI Service connection
      AI_SERVICE_URL: http://ai:5000
      # MLFlow tracking
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      RABBIT_HOST: host.docker.internal
      RABBIT_PORT: 5672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      GAME_REGISTRATION_ID: "c4b3e5f6-7890-1234-5678-90abcdef1234"
      GAME_FRONTEND_URL: "http://localhost:3000"
      PLATFORM_GAME_EXCHANGE: "game.events.exchange"
      # ML Prediction logging
      ENABLE_PREDICTION_LOGGING: "true"
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src
      - ./database:/app/database
      # Mount data directory for parquet files and ML models
      - ./data:/app/data
      # Mount reports directory
      - ./reports:/app/reports
      - ./scripts:/app/scripts
      # Preserve virtual environment
      - app_venv:/app/.venv
    networks:
      - connect_four_network
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    # Start the FastAPI server
    command: uvicorn src.api.api:app --host 0.0.0.0 --port 8000 --reload

  # AI Service (MCTS for Connect Four)
  ai:
    build:
      # context: ../ai-implementation
      context: ../../AI-impl/ai-implementation
      dockerfile: Dockerfile
    container_name: connect_four_ai
    environment:
      # Flask settings
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - connect_four_network
    restart: unless-stopped

  # MLFlow Experiment Tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: connect_four_mlflow
    ports:
      - "5002:5000"
    volumes:
      # MLFlow tracking data (experiments, runs, metrics)
      - ./mlruns:/mlflow
    environment:
      # MLFlow backend store (SQLite by default)
      MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow/mlflow.db
      # MLFlow artifact store
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    networks:
      - connect_four_network
    restart: unless-stopped

networks:
  connect_four_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  app_venv:
    driver: local
