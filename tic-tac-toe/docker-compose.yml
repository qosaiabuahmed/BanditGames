services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tictactoe-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Student_1234
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tictactoe-network

  # AI Service (MCTS)
  ai-service:
    build:
      context: ../AI-impl/ai-implementation
      dockerfile: Dockerfile
    container_name: tictactoe-ai-service
    ports:
      - "5010:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:5000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tictactoe-network
    restart: unless-stopped

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tictactoe-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: Student_1234
      AI_SERVICE_URL: http://ai-service:5000
      RABBIT_HOST: host.docker.internal
      RABBIT_PORT: 5672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      GAME_REGISTRATION_ID: "a1b2c3d4-5678-90ab-cdef-123456789abc"
      GAME_FRONTEND_URL: "http://localhost:5174"
      PLATFORM_GAME_EXCHANGE: "game.events.exchange"
    ports:
      - "8189:8189"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - tictactoe-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  tictactoe-network:
    driver: bridge
